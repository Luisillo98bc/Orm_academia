services:
  db:
    image: postgres:15-alpine
    container_name: academia_virtual_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academia_virtual
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - academia_virtual_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d academia_virtual']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: academia_virtual_backend
    restart: always
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3003:3000'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LEGACY_UPLOADS_DIR: /app/backend/legacy-host-uploads
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-cash}
      ENABLE_SCHEDULED_JOBS: ${ENABLE_SCHEDULED_JOBS:-true}
      SCHEDULED_JOBS_MODE: ${SCHEDULED_JOBS_MODE:-inline}
      CONTRACT_ALERT_INTERVAL_MS: ${CONTRACT_ALERT_INTERVAL_MS:-86400000}
      CERTIFICATE_AUTO_INTERVAL_MS: ${CERTIFICATE_AUTO_INTERVAL_MS:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-luisenriquebautistacoz@gmail.com}
    volumes:
      - academia_virtual_uploads:/app/backend/uploads
      - ./backend/uploads:/app/backend/legacy-host-uploads:ro
      - academia_virtual_private_uploads:/app/backend/private-uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3003/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3003}
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-pk_test_configure_me}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: academia_virtual_frontend
    restart: always
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3002:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4.3}
    container_name: academia_virtual_clamav
    restart: always
    volumes:
      - academia_virtual_clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3310/ || clamdscan --ping 1 >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Ejecuta alertas y certificados en un proceso persistente sin abrir otro HTTP server.
  # Para evitar duplicar jobs, usa docker-compose.worker.yml: allí el backend queda disabled.
  worker:
    profiles: ['worker']
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: academia_virtual_worker
    restart: always
    command: ['sh', '-c', 'npx prisma migrate deploy --schema=../database/prisma/schema.prisma && node dist/src/worker']
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ENABLE_SCHEDULED_JOBS: 'true'
      SCHEDULED_JOBS_MODE: worker
    volumes:
      - academia_virtual_private_uploads:/app/backend/private-uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  academia_virtual_data:
    name: database_academia_virtual_data
    external: true
  academia_virtual_uploads:
  academia_virtual_private_uploads:
  academia_virtual_clamav_data:
