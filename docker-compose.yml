services:
  db:
    image: postgres:15-alpine
    container_name: academia_virtual_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academia_virtual
    ports:
      - '5434:5432'
    volumes:
      - academia_virtual_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d academia_virtual']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: academia_virtual_backend
    restart: always
    ports:
      - '3003:3000'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/academia_virtual?schema=public
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3002
      FRONTEND_URL: http://localhost:3002
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      STORAGE_PROVIDER: local
    volumes:
      - academia_virtual_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3003/api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:3003
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-pk_test_configure_me}
    container_name: academia_virtual_frontend
    restart: always
    ports:
      - '3002:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  academia_virtual_data:
    name: database_academia_virtual_data
  academia_virtual_uploads:
