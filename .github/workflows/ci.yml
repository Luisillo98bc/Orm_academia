name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academia_virtual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academia_virtual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academia_virtual?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/academia_virtual?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: lax
      NODE_ENV: test
      STORAGE_PROVIDER: local
      PRIVATE_STORAGE_DIR: /tmp/academia-private
      STORAGE_SIGNED_URL_TTL_SECONDS: 3600
      PAYMENTS_MODE: cash
      ENABLE_SCHEDULED_JOBS: false
      SCHEDULED_JOBS_MODE: disabled
      NEXT_PUBLIC_API_URL: http://localhost:3003/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
      NEXT_PUBLIC_WS_URL: http://localhost:3003
      NEXT_PUBLIC_CULQI_PUBLIC_KEY: pk_test_configure_me
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            database/package-lock.json
            frontend/package-lock.json

      - name: Production preflight and load measurement tests
        run: node --test scripts/preflight-production.spec.mjs scripts/load-test.spec.mjs scripts/sustained-load.spec.mjs

      - name: Install database dependencies
        working-directory: database
        run: npm ci

      - name: Database dependency audit
        working-directory: database
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        working-directory: database
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: SMTP verification and delivery tests
        run: node --test backend/scripts/test-smtp.spec.mjs backend/scripts/migrate-to-minio.spec.mjs

      - name: Generate backend Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply database migrations
        working-directory: database
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed database
        working-directory: database
        run: npx prisma db seed

      - name: Backup and restore smoke test
        shell: bash
        run: |
          backup_file="$RUNNER_TEMP/academia-ci.dump"
          PGPASSWORD=postgres pg_dump -h localhost -U postgres -d academia_virtual -Fc -f "$backup_file"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS academia_restore_ci"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE academia_restore_ci"
          PGPASSWORD=postgres pg_restore --no-owner --exit-on-error -h localhost -U postgres -d academia_restore_ci "$backup_file"
          PGPASSWORD=postgres psql -h localhost -U postgres -d academia_restore_ci -v ON_ERROR_STOP=1 -c "SELECT 1 FROM users LIMIT 1"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE academia_restore_ci"

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend unit tests
        working-directory: backend
        run: npm test -- --runInBand --no-cache

      - name: Backend coverage gate
        working-directory: backend
        run: npm run test:cov -- --runInBand --no-cache

      - name: Backend E2E tests
        working-directory: backend
        run: npm run test:e2e -- --runInBand --forceExit

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Seed browser test data
        working-directory: database
        run: npm run prisma:seed:demo

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E Chrome y móvil
        working-directory: frontend
        run: |
          PORT=3003 node ../backend/dist/src/main.js > /tmp/academia-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3003/api/v1/health > /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/academia-api.log; exit 1; fi
            sleep 2
          done
          npm run test:e2e
