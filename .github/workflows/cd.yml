name: CD - production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on production VM
    # The runner lives on the VM, so the VM needs no inbound SSH port.
    runs-on: [self-hosted, linux, x64, production]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://academia.luisenriquebautistacoz.com
    steps:
      - name: Deploy and verify
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          test -n "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          set -a
          . deploy/.env.tunnel
          set +a

          compose() {
            docker compose --env-file deploy/.env.production \
              -f docker-compose.yml -f compose.production.yaml "$@"
          }

          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch --prune origin main
          git checkout --detach "$RELEASE_SHA"
          bash scripts/preflight-production.sh
          compose config --quiet
          mkdir -p backups
          compose up -d db minio minio-init
          compose exec -T db pg_dump -U postgres -d academia_virtual -Fc \
            > "backups/pre-deploy-$RELEASE_SHA.dump"
          compose build backend frontend
          compose run --rm backend npx prisma migrate deploy \
            --schema=../database/prisma/schema.prisma
          compose up -d --wait --wait-timeout 180 backend frontend clamav cloudflared
          compose exec -T backend node -e "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          compose ps
